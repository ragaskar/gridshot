name: gridshot

# Portability notes for non-Docker runtimes (rootless Podman on SELinux):
#
#   :z  — SELinux shared relabel. Every bind mount here is shared by design:
#         all three services are the same application under one user, and
#         config/ is genuinely mounted by all of them. A private :Z label
#         would be re-applied per container on every run, so two services
#         sharing a path would lock each other out. Docker parses z/Z as part
#         of the Compose spec and the daemon ignores them off SELinux.
#
#   GRIDSHOT_USER — under any rootless engine (Podman or rootless Docker),
#         container UID 0 maps to the invoking host user, so "0:0" is what
#         writes files owned by you. Under rootful Docker it means real root,
#         hence the 1000:1000 default. scripts/lib-compose.sh detects this and
#         exports it for you; set it in .env if you drive compose directly.

services:
  cli:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: gridshot-app
    user: "${GRIDSHOT_USER:-1000:1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      GRIDSHOT_CONFIG_DIR: /app/config
      HF_TOKEN: ${HF_TOKEN:-}
      GRIDSHOT_SEGSERVER_URL: http://segserver:8801
    volumes:
      - .:/app:z

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        GRIDSHOT_GIT_SHA: ${GRIDSHOT_GIT_SHA:-unknown}
        GRIDSHOT_BUILD_TIME: ${GRIDSHOT_BUILD_TIME:-unknown}
    image: gridshot-web
    user: "${GRIDSHOT_USER:-1000:1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      GRIDSHOT_CONFIG_DIR: /app/config
      GRIDSHOT_SEGSERVER_URL: http://segserver:8801
    ports:
      - "${GRIDSHOT_BIND_ADDR:-127.0.0.1}:8800:8800"  # localhost by default; scripts/up --public-bind widens this to 0.0.0.0
    volumes:
      - ./projects:/app/projects:z
      - ./config:/app/config:z


  segserver:
    build:
      context: .
      dockerfile: docker/segserver.Dockerfile
    image: gridshot-segserver
    user: "${GRIDSHOT_USER:-1000:1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /app/config/cache/hf
      TORCH_HOME: /app/config/cache/torch
      GRIDSHOT_SAM: ${GRIDSHOT_SAM:-sam2}
      GRIDSHOT_INFERENCE_QUEUE_SIZE: ${GRIDSHOT_INFERENCE_QUEUE_SIZE:-2}
    expose:
      - "8801"  # compose network only; web/cli are the public boundary
    volumes:
      - ./config:/app/config:z
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities: [gpu]
              device_ids: ["${GRIDSHOT_GPU_DEVICE:-nvidia.com/gpu=0}"]
